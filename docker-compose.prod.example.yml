# MODELO DE INFRAESTRUTURA, não lançamento automaticamente seguro.
# Copie .env.example para .env e configure secrets, domínio, URL, Stripe, SMTP.
# Serviços internos não abrem portas públicas; use TLS na camada reversa.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendaflow
      POSTGRES_USER: agendaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendaflow -d agendaflow"]
      interval: 10s
      retries: 10
    networks: [private]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      AGENDAFLOW_ENV: production
      DATABASE_URL: postgresql+psycopg://agendaflow:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/agendaflow
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "agendaflow.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.16.0.0/12"]
    networks: [private]
  mailer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      AGENDAFLOW_ENV: production
      DATABASE_URL: postgresql+psycopg://agendaflow:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/agendaflow
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.run_mailer"]
    networks: [private]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AGENDAFLOW_DOMAIN: ${AGENDAFLOW_DOMAIN:?Configure AGENDAFLOW_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [private]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  private:
